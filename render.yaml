# ===========================================================
# Render.com Blueprint for ERP-V2
# Defines 3 services that deploy together:
#   1. PostgreSQL database (managed by Render, free for 90 days)
#   2. .NET 8 backend (Docker, listens on 8080)
#   3. Next.js 15 frontend (Docker, listens on 3000)
#
# How to use:
#   1. Push the repo to GitHub (or GitLab).
#   2. In Render dashboard, choose "New" -> "Blueprint".
#   3. Point Render at the repo; it reads this file and provisions everything.
#
# Service names are fixed to keep cross-service URLs predictable:
#   erp-v2-db       -> internal connection string
#   erp-v2-backend  -> https://erp-v2-backend.onrender.com
#   erp-v2-frontend -> https://erp-v2-frontend.onrender.com
# ===========================================================

databases:
  - name: erp-v2-db
    databaseName: erp
    user: erp
    plan: free
    region: oregon
    ipAllowList: []   # only accessible from within Render

services:

  # -----------------------------------------------------------
  # .NET 8 backend
  # -----------------------------------------------------------
  - type: web
    name: erp-v2-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"
      # Sprint 41 — Trusted accountant mode flag.
      # When "true", the FullYearSeeder auto-approves and auto-posts
      # every journal entry it creates (Mavis signs as the accountant
      # for the demo data). When unset/false, the seeder writes
      # entries as DRAFT and the human accountant must approve +
      # post them through the Journal page. The default is the
      # strict path — the seeder would otherwise bypass the
      # accountant's review for any future seed run.
      - key: SEEDER_TRUSTED_ACCOUNTANT_MODE
        value: "true"
      # NOTE on ConnectionStrings__Default:
      #
      # We use `fromDatabase` to bind to the database defined in this
      # blueprint. The reference is by the *blueprint* name (erp-v2-db),
      # not the deployed name (which Render may suffix, e.g.
      # erp-v2-db-1oz7, to avoid conflicts). The reference resolves at
      # deploy time to the live database's connectionString property.
      #
      # If this env var ends up empty on a fresh deploy, the most common
      # cause is a deleted-then-recreated database: Render keeps the old
      # reference, and the suffix on the new DB breaks the lookup. The
      # fix is to set the value manually in the dashboard (use the
      # External Database URL converted to Npgsql format) or to delete
      # the blueprint entirely and create a fresh one.
      - key: ConnectionStrings__Default
        fromDatabase:
          name: erp-v2-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: erp-v2
      - key: Jwt__Audience
        value: erp-v2-client
      - key: Jwt__ExpiryMinutes
        value: "1440"
      - key: CORS__Origins
        value: https://erp-v2-frontend.onrender.com
      # Sprint 41 — auto-seed the demo company on every backend
      # startup. Combined with the env var below, this means
      # every deploy of the backend results in a clean,
      # fully-posted demo dataset within ~3 minutes of the
      # backend becoming reachable. The seeder is a no-op if
      # the demo company already has invoices, so manual edits
      # are preserved across restarts.
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: DEMO_COMPANY_ID
        value: "c9fba678-29db-43ec-8c34-5a35d205e79b"
      # Sprint 41 — when AUTO_SEED_DEMO is on, the seeder runs
      # in "trusted accountant" mode (Mavis signs every JE).
      # Outside of auto-seed, this is opt-in via the env var so
      # production deployments can keep the human-only flow.
      - key: SEEDER_TRUSTED_ACCOUNTANT_MODE
        value: "true"

  # -----------------------------------------------------------
  # Next.js 15 frontend
  # -----------------------------------------------------------
  - type: web
    name: erp-v2-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render free-tier web services expect to bind on port 10000
      # by default. The Dockerfile and this env var must agree,
      # otherwise Render's reverse proxy hits a port nothing is
      # listening on and returns 502 Bad Gateway.
      - key: PORT
        value: "10000"
      # The frontend makes *relative* API calls (/api/...). Next.js's
      # rewrite (in next.config.mjs) forwards them to the backend
      # using this URL. Render's internal DNS resolves
      # `erp-v2-backend` to the actual deployed backend container
      # (regardless of any URL suffix Render added), so this works
      # even when the backend is at e.g. erp-v2-backend-86pf.
      #
      # We previously tried to bake NEXT_PUBLIC_API_URL with
      # fromService at build time, but the only valid properties
      # are connectionString/host/hostport/port — not `url`. And
      # fromService resolution happens at deploy time, after the
      # Next.js build has already inlined NEXT_PUBLIC_*. So the
      # only robust approach is to never expose the backend URL to
      # the client: rewrite at the Next.js layer.
      - key: BACKEND_INTERNAL_URL
        value: http://erp-v2-backend:8080
      - key: WATCHPACK_POLLING
        value: "true"
