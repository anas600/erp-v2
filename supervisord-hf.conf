; ==========================================================
; supervisord config for the Hugging Face single-container image.
; Manages three processes in order: PostgreSQL → migrations+backend → frontend.
; ==========================================================

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/15/main -c config_file=/etc/postgresql/15/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:migrate]
command=/usr/local/bin/start-hf.sh migrate
user=root
autostart=true
autorestart=false
startsecs=0
priority=20
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=dotnet /opt/backend/ErpV2.dll
directory=/opt/backend
user=root
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=ASPNETCORE_URLS="http://localhost:8080",ConnectionStrings__Default="Host=localhost;Port=5432;Database=erp;Username=erp;Password=erp_secret",Jwt__Key="hf-space-demo-key-not-for-production-please-change-in-real-deployments-32chars",Jwt__Issuer="erp-v2",Jwt__Audience="erp-v2-client",Jwt__ExpiryMinutes="1440",CORS__Origins="http://localhost:7860,http://localhost:3000,https://*.hf.space"

[program:frontend]
command=node server.js
directory=/opt/frontend
user=root
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="7860",HOSTNAME="0.0.0.0",BACKEND_INTERNAL_URL="http://localhost:8080"

[group:erp]
programs=postgres,migrate,backend,frontend
priority=999
